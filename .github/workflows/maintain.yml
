name: maintain pinned validator mirror
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: write
concurrency:
  group: validator-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Preserve checksum-pinned release and source information
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=$(jq -r .name scripts/story-video-artifact.json)
          tag=$(jq -r .tag scripts/story-video-artifact.json)
          sha=$(jq -r .sha256 scripts/story-video-artifact.json)
          mkdir -p generated-artifacts
          cd generated-artifacts
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name.tar.xz"
          else
            curl --fail --location --retry 3 --max-time 600 "$(jq -r .upstream ../scripts/story-video-artifact.json)" -o "$name.tar.xz"
            echo "$sha  $name.tar.xz" | sha256sum --check
            tar -xJf "$name.tar.xz" "$name/LICENSE.txt"
            cp "$name/LICENSE.txt" LICENSE.txt
            curl --fail --location --retry 3 --max-time 300 https://api.github.com/repos/FFmpeg/FFmpeg/tarball/46d899d7a0 -o ffmpeg-source.tar.gz
            curl --fail --location --retry 3 --max-time 300 https://api.github.com/repos/BtbN/FFmpeg-Builds/tarball/autobuild-2026-10-14-13-03 -o build-recipes.tar.gz
            cp ../scripts/story-video-artifact.json SOURCE.json
            sha256sum "$name.tar.xz" ffmpeg-source.tar.gz build-recipes.tar.gz LICENSE.txt SOURCE.json > SHA256SUMS
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Pinned FFprobe LGPL 8.1.3" --notes "Unmodified BtbN archive, license, corresponding FFmpeg source and build recipes. No Night Desk application code. See SOURCE.json and SHA256SUMS." "$name.tar.xz" LICENSE.txt SOURCE.json SHA256SUMS ffmpeg-source.tar.gz build-recipes.tar.gz
          fi
          echo "$sha  $name.tar.xz" | sha256sum --check
      - name: Check availability and upstream updates
        run: node scripts/check-story-video-artifact.mjs
